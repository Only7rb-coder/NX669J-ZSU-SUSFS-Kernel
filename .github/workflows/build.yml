name: Build NX669J ZSU SUSFS Kernel

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub Release after all validation checks
        required: true
        type: boolean
        default: false
      build_lkm:
        description: Attempt a separate KernelSU LKM module artifact when supported by the source
        required: true
        type: boolean
        default: true
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: nx669j-kernel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: NX669J Android 12 QGKI / KernelSU-Next / SUSFS
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          testing: false

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential clang cpio flex \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabihf \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
            libelf-dev libssl-dev lld llvm pahole \
            python3 rsync unzip which zip

      - name: Validate checked-in device contract
        run: |
          set -euo pipefail
          test "$(grep '^KERNEL_DEFCONFIG=' config/device.env | cut -d= -f2-)" = "vendor/lahaina-qgki_defconfig"
          test "$(grep '^NUBIA_TARGET_PRODUCT=' config/device.env | cut -d= -f2-)" = "NX669J"
          test "$(grep '^SUSFS_REF=' config/device.env | cut -d= -f2-)" = "kernel-5.4"
          test "$(grep '^SUSFS_API_REF=' config/device.env | cut -d= -f2-)" = "gki-android12-5.10"
          test "$(grep '^KSU_REF=' config/device.env | cut -d= -f2-)" = "v3.1.0-legacy"
          test "$(grep '^ZSU_MANAGER_DER_LENGTH=' config/device.env | cut -d= -f2-)" = "0x318"
          grep -q '^ZSU_MANAGER_CERT_SHA256=ba1159a5819dec96cdcb2498bef73170b0ba1735c12139bde1b7677bf7c5c2ab$' config/device.env
          test -f scripts/clean_vendor_conflicts.py
          test -f scripts/port_susfs_fsnotify.py
          test -f scripts/port_susfs_54_defs.py
          test -f scripts/port_susfs_54_legacy.py
          test -f scripts/port_susfs_54_v2_api.py
          test -f scripts/port_susfs_ksu_domains.py
          test -f scripts/port_path_umount_54.py
          test -f scripts/port_susfs_try_umount.py
          test -f scripts/build_kernel.sh
          grep -q 'port_susfs_ksu_domains.py' scripts/build_kernel.sh

      - name: Build kernel and integration artifacts
        env:
          JOBS: 2
        run: |
          set -euo pipefail
          chmod +x scripts/build_kernel.sh
          ./scripts/build_kernel.sh

      - name: Package corrected AnyKernel3 installer
        run: |
          set -euo pipefail
          test -s artifacts/Image
          rm -rf AnyKernel3
          git clone --depth 1 --branch master https://github.com/Only7rb-coder/ZSU-GKI-AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git
          cp artifacts/Image AnyKernel3/Image
          test -f AnyKernel3/anykernel.sh
          grep -q 'split_boot' AnyKernel3/anykernel.sh
          grep -q 'flash_boot' AnyKernel3/anykernel.sh
          ! grep -qE '^[[:space:]]*(dump_boot|write_boot)' AnyKernel3/anykernel.sh
          (cd AnyKernel3 && zip -r9 "../artifacts/NX669J-ZSU-SUSFS-AnyKernel3.zip" . -x '*.git*')

      - name: Verify artifacts and integration markers
        run: |
          set -euo pipefail
          test -s artifacts/Image
          unzip -t artifacts/NX669J-ZSU-SUSFS-AnyKernel3.zip
          unzip -p artifacts/NX669J-ZSU-SUSFS-AnyKernel3.zip anykernel.sh | grep -q 'split_boot'
          unzip -p artifacts/NX669J-ZSU-SUSFS-AnyKernel3.zip anykernel.sh | grep -q 'flash_boot'
          grep -q '^CONFIG_KSU=y$' kernel/arch/arm64/configs/vendor/lahaina-qgki_defconfig
          grep -q '^CONFIG_KSU_SUSFS=y$' kernel/arch/arm64/configs/vendor/lahaina-qgki_defconfig
          grep -q '^CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y$' kernel/arch/arm64/configs/vendor/lahaina-qgki_defconfig
          grep -q '^CONFIG_KSU_SUSFS_TRY_UMOUNT=y$' kernel/arch/arm64/configs/vendor/lahaina-qgki_defconfig
          grep -q '^CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y$' kernel/arch/arm64/configs/vendor/lahaina-qgki_defconfig
          grep -Fq 'struct st_susfs_try_umount {' kernel/include/linux/susfs.h
          grep -Fq '#define CMD_SUSFS_RUN_UMOUNT_FOR_CURRENT_MNT_NS 0x555d0' kernel/include/linux/susfs_def.h
          grep -Fq 'int susfs_add_try_umount(void __user **user_info)' kernel/fs/susfs.c
          grep -Fq 'void susfs_try_umount(uid_t target_uid)' kernel/fs/susfs.c
          grep -Fq 'void susfs_try_umount_all(uid_t target_uid)' kernel/fs/susfs.c
          grep -Fq 'void susfs_auto_add_try_umount_for_bind_mount(struct path *path)' kernel/fs/susfs.c
          grep -Fq 'CONFIG_KSU_SUSFS_TRY_UMOUNT\n' kernel/fs/susfs.c
          grep -Fq 'susfs_run_try_umount_for_current_mnt_ns();' kernel/KernelSU-Next/kernel/supercalls.c
          grep -Fq 'susfs_auto_add_try_umount_for_bind_mount(path);' kernel/fs/namespace.c
          grep -Fq 'config KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT' kernel/KernelSU-Next/kernel/Kconfig
          grep -q '^#define SUSFS_VERSION "v2.2.0"$' kernel/include/linux/susfs.h
          grep -q '^#define SUSFS_MAGIC 0xFAFAFAFA$' kernel/include/linux/susfs_def.h
          grep -q '^#define DEFAULT_SUS_MNT_ID 100000$' kernel/include/linux/susfs_def.h
          grep -q '^#define TASK_STRUCT_NON_ROOT_USER_APP_PROC BIT(24)$' kernel/include/linux/susfs_def.h
          grep -Fq 'int path_umount(struct path *path, int flags)' kernel/fs/namespace.c
          grep -Fq 'int path_umount(struct path *path, int flags);' kernel/fs/internal.h
          grep -Fq 'void susfs_run_sus_path_loop(uid_t uid)' kernel/fs/susfs.c
          grep -Fq 'int susfs_sus_ino_for_filldir64(unsigned long ino)' kernel/fs/susfs.c
          grep -Fq 'void susfs_sus_ino_for_generic_fillattr(unsigned long ino, struct kstat *stat)' kernel/fs/susfs.c
          grep -Fq 'void susfs_sus_ino_for_show_map_vma(unsigned long ino, dev_t *out_dev, unsigned long *out_ino)' kernel/fs/susfs.c
          grep -Fq 'struct filename *susfs_get_redirected_path(unsigned long ino)' kernel/fs/susfs.c
          grep -Fq 'void susfs_reorder_mnt_id(void)' kernel/fs/susfs.c
          grep -q 'handle_event = susfs_handle_sdcard_inode_event' kernel/fs/susfs.c
          ! grep -q 'handle_inode_event = susfs_handle_sdcard_inode_event' kernel/fs/susfs.c
          ! grep -R -nE '^(<<<<<<<|=======|>>>>>>>)' kernel/drivers/rtc/rtc-pm8xxx.c
          grep -R -q 'KSU_NEXT_MANAGER_SIZE\|KSU_NEXT_MANAGER_HASH\|KSU_NEXT_MANAGER_LIST' kernel/KernelSU-Next/kernel
          grep -R -q 'ba1159a5819dec96cdcb2498bef73170b0ba1735c12139bde1b7677bf7c5c2ab' kernel/KernelSU-Next/kernel
          grep -Fq 'bool susfs_is_current_ksu_domain(void)' kernel/KernelSU-Next/kernel/selinux/selinux.c
          grep -Fq 'bool susfs_is_current_zygote_domain(void)' kernel/KernelSU-Next/kernel/selinux/selinux.c
          printf 'Image bytes: '
          stat -c '%s' artifacts/Image
          printf 'AnyKernel bytes: '
          stat -c '%s' artifacts/NX669J-ZSU-SUSFS-AnyKernel3.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NX669J-ZSU-SUSFS-Kernel-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Create release
        if: inputs.publish_release == true && github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nx669j-${{ github.run_number }}
          name: NX669J ZSU SUSFS Kernel build ${{ github.run_number }}
          generate_release_notes: true
          files: artifacts/*
